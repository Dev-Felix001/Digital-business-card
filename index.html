<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Felix Kipngetich - Digital Business Card</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="business-card">
        <!-- Header Section -->
        <div class="card-header">
            <div class="avatar">
                <div class="avatar-placeholder">
                    <i class="fas fa-user"></i>
                </div>
            </div>
            <h1 class="name">Felix Kipngetich</h1>
            <p class="title">Full Stack Developer</p>
        </div>

        <!-- Contact Information -->
        <div class="contact-info">
            <div class="contact-item">
                <i class="fas fa-envelope"></i>
                <span>felix.kipngetich@email.com</span>
            </div>
            <div class="contact-item">
                <i class="fas fa-phone"></i>
                <span>+254 712 345 678</span>
            </div>
            <div class="contact-item">
                <i class="fas fa-map-marker-alt"></i>
                <span>Nairobi, Kenya</span>
            </div>
        </div>

        <!-- Skills Section -->
        <div class="skills">
            <h3>Skills</h3>
            <div class="skill-tags">
                <span class="skill-tag">HTML/CSS</span>
                <span class="skill-tag">JavaScript</span>
                <span class="skill-tag">React</span>
                <span class="skill-tag">Node.js</span>
                <span class="skill-tag">Python</span>
                <span class="skill-tag">UI/UX Design</span>
            </div>
        </div>

        <!-- Social Links -->
        <div class="social-links">
            <h3>Connect With Me</h3>
            <div class="social-icons">
                <a href="#" class="social-link linkedin">
                    <i class="fab fa-linkedin-in"></i>
                </a>
                <a href="#" class="social-link github">
                    <i class="fab fa-github"></i>
                </a>
                <a href="#" class="social-link twitter">
                    <i class="fab fa-twitter"></i>
                </a>
                <a href="#" class="social-link portfolio">
                    <i class="fas fa-globe"></i>
                </a>
            </div>
        </div>

        <!-- Call to Action -->
        <div class="cta">
            <a href="mailto:felix.kipngetich@email.com" class="contact-btn">
                <i class="fas fa-paper-plane"></i>
                Contact Me
            </a>
        </div>

        <!-- QR Code (Optional) -->
        <div class="qr-section">
            <div class="qr-code">
                <div class="qr-placeholder">
                    <i class="fas fa-qrcode"></i>
                </div>
            </div>
            <p class="qr-text">Scan to save contact</p>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer">
        <p>&copy; 2024 Felix Kipngetich. All rights reserved.</p>
    </div>
</body>
</html>
